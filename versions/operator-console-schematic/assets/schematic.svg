<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Taylor Yates — creative systems schematic</title>
  <desc id="desc">A blueprint connects interface, media, render, and operations into a feedback circuit.</desc>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9f4ff" stroke-opacity=".08"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#d9f4ff" stroke-opacity=".15"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="430" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="430" fill="#0739a8"/>
    <rect width="1200" height="430" fill="url(#major)"/>
    <path d="M48 49h1104v332H48z" fill="none" stroke="#d9f4ff" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="72" y="78" fill="#d9f4ff" font-size="13" letter-spacing="3">TY–CS–01 / CREATIVE SYSTEMS / REV A</text>
      <text x="72" y="146" fill="#fff45f" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800">TAYLOR YATES</text>
      <text x="74" y="179" fill="#d9f4ff" font-size="15" letter-spacing="2">FULL-STACK ENGINEER · SPACEBACK · NEW YORK</text>

      <g transform="translate(73 231)">
        <g fill="#0739a8" stroke="#d9f4ff" stroke-width="3">
          <rect width="190" height="79" rx="3"/><rect x="262" width="190" height="79" rx="3"/><rect x="524" width="190" height="79" rx="3"/><rect x="786" width="190" height="79" rx="3"/>
        </g>
        <g fill="#fff45f" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">
          <text x="95" y="35">INTERFACE</text><text x="357" y="35">MEDIA</text><text x="619" y="35">RENDER</text><text x="881" y="35">OPERATIONS</text>
        </g>
        <g fill="#d9f4ff" font-size="10" text-anchor="middle">
          <text x="95" y="58">intent in</text><text x="357" y="58">time + pixels</text><text x="619" y="58">frames out</text><text x="881" y="58">evidence back</text>
        </g>
        <g fill="none" stroke="#fff45f" stroke-width="4" filter="url(#glow)">
          <path d="M190 39h72"/><path d="M452 39h72"/><path d="M714 39h72"/>
          <path d="M881 79v54H95V79"/>
        </g>
        <g fill="#fff45f">
          <path d="M255 32l13 7-13 7Z"/><path d="M517 32l13 7-13 7Z"/><path d="M779 32l13 7-13 7Z"/><path d="M102 86l-7-13-7 13Z"/>
        </g>
        <text x="488" y="127" fill="#d9f4ff" font-size="10" text-anchor="middle" letter-spacing="2">FEEDBACK LOOP</text>
      </g>

      <text x="72" y="355" fill="#d9f4ff" font-size="10">DRAWN FROM PRODUCTION EVIDENCE</text>
      <text x="968" y="355" fill="#fff45f" font-size="10">SIGNAL CONTINUITY: PASS</text>
    </g>
  </g>
</svg>
