<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Taylor Yates — creative systems patchbay</title>
  <desc id="desc">Colored patch cables route product, interface, media, and infrastructure inputs into a finished experience.</desc>
  <defs>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#565c58"/>
      <stop offset=".48" stop-color="#333936"/>
      <stop offset="1" stop-color="#202522"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
