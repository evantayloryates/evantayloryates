<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Taylor's creative systems operator console</title>
  <desc id="desc">A production console showing Taylor online at the intersection of interface, media, and infrastructure.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111326"/>
      <stop offset="1" stop-color="#17102a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#56e6c2"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#080914"/>
  <rect x="22" y="22" width="1156" height="386" rx="15" fill="url(#shell)" stroke="#9b8cff" stroke-opacity=".34"/>
  <rect x="22" y="22" width="1156" height="52" rx="15" fill="#22233b"/>
  <rect x="22" y="59" width="1156" height="15" fill="#22233b"/>
  <circle cx="53" cy="48" r="7" fill="#ff6b7a"/><circle cx="77" cy="48" r="7" fill="#ffd166"/><circle cx="101" cy="48" r="7" fill="#56e6c2"/>
  <text x="600" y="54" text-anchor="middle" fill="#8f91a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">taylor@creative-systems — 120×32</text>
  <rect x="22" y="74" width="1156" height="334" fill="url(#scan)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="64" y="121" fill="#56e6c2" font-size="16">taylor@nyc</text>
    <text x="166" y="121" fill="#73768d" font-size="16">:</text>
    <text x="180" y="121" fill="#9b8cff" font-size="16">~/creative-systems</text>
    <text x="370" y="121" fill="#e8e8f4" font-size="16">$ status --live</text>

    <text x="64" y="173" fill="#f2f0ff" font-size="33" font-weight="700">TAYLOR YATES</text>
    <text x="64" y="207" fill="#8f91a8" font-size="16">full-stack engineer / media systems operator</text>

    <text x="64" y="264" fill="#73768d" font-size="13">SERVICES</text>
    <text x="64" y="294" fill="#d9d8e7" font-size="15">interface</text>
    <text x="230" y="294" fill="#56e6c2" font-size="15">● online</text>
    <text x="64" y="324" fill="#d9d8e7" font-size="15">media</text>
    <text x="230" y="324" fill="#56e6c2" font-size="15">● online</text>
    <text x="64" y="354" fill="#d9d8e7" font-size="15">infrastructure</text>
    <text x="230" y="354" fill="#56e6c2" font-size="15">● online</text>

    <text x="548" y="264" fill="#73768d" font-size="13">SIGNAL</text>
    <path d="M548 321h29l16-42 19 72 22-51 18 21h35l16-28 17 43 20-15h37l17-51 22 81 18-30h39l16-22 19 22h44" fill="none" stroke="url(#violet)" stroke-width="3" filter="url(#softGlow)"/>
    <text x="548" y="372" fill="#8f91a8" font-size="13">product → code → render → experience</text>

    <text x="64" y="389" fill="#9b8cff" font-size="15">›</text>
    <rect x="84" y="376" width="10" height="17" fill="#56e6c2">
      <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
