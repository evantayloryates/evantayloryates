<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Taylor Yates — creative systems liner notes</title>
  <desc id="desc">An album sleeve pairs a technical track list with a record whose grooves map the creative signal path.</desc>
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dad5ff"/>
      <stop offset=".55" stop-color="#b9aeff"/>
      <stop offset="1" stop-color="#8d81e8"/>
    </linearGradient>
    <radialGradient id="vinyl">
      <stop offset="0" stop-color="#313126"/>
      <stop offset=".18" stop-color="#10110d"/>
      <stop offset=".52" stop-color="#27271f"/>
      <stop offset="1" stop-color="#090a08"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#201f19" opacity=".12"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="520" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="520" fill="#dfff45"/>
    <rect x="0" width="690" height="520" fill="url(#sleeve)"/>
    <rect x="0" width="690" height="520" fill="url(#dots)"/>
    <path d="M0 430L690 78v442H0Z" fill="#ff4e91" opacity=".92"/>

    <g font-family="Arial, Helvetica, sans-serif" fill="#171812">
      <text x="54" y="58" font-size="14" font-weight="700" letter-spacing="4">TY–001 / STEREO / NYC</text>
      <text x="52" y="145" font-size="64" font-weight="900" letter-spacing="-3">TAYLOR</text>
      <text x="52" y="207" font-size="64" font-weight="900" letter-spacing="-3">YATES</text>
      <text x="55" y="244" font-size="17" font-weight="700" letter-spacing="2">CREATIVE SYSTEMS — LINER NOTES</text>

      <text x="55" y="326" font-size="13" font-weight="700" letter-spacing="3">SIDE A</text>
      <text x="55" y="355" font-size="18">01  INTERFACE</text>
      <text x="55" y="383" font-size="18">02  MOTION</text>
      <text x="55" y="411" font-size="18">03  INFRASTRUCTURE</text>
      <text x="55" y="458" font-size="12" font-weight="700" letter-spacing="2">PLAY FROM THE BEGINNING</text>
    </g>

    <g transform="translate(930 260)">
      <circle r="224" fill="url(#vinyl)"/>
      <g fill="none" stroke="#828270" stroke-opacity=".42">
        <circle r="207"/><circle r="198"/><circle r="187"/><circle r="175"/><circle r="163"/><circle r="152"/><circle r="139"/><circle r="128"/><circle r="118"/>
      </g>
      <circle r="91" fill="#dfff45"/>
      <circle r="67" fill="#ff4e91"/>
      <circle r="10" fill="#171812"/>
      <text y="-20" text-anchor="middle" fill="#171812" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">TAYLOR YATES</text>
      <text y="2" text-anchor="middle" fill="#171812" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.6">WEB / MOTION / SYSTEMS</text>
      <text y="28" text-anchor="middle" fill="#171812" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1.5">33⅓ RPM</text>
    </g>

    <g fill="#171812" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="714" y="38">LONG PLAYING</text>
      <text x="1090" y="493">SIDE A</text>
    </g>
  </g>
</svg>
