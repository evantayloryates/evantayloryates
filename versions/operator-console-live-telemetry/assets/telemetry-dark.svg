<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Taylor Yates — live public GitHub telemetry</title>
  <desc id="desc">A self-hosted panel reports public repositories, followers, recent event sample size, and recently active public repositories.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .label { fill: #8d9aae; font-size: 11px; letter-spacing: 2px; }
      .value { fill: #f0f4fa; font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 800; }
      .route { fill: #f0f4fa; font-size: 14px; }
      .date { fill: #8d9aae; font-size: 10px; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1200" height="460" rx="22" fill="#080a10"/>
  <rect width="1200" height="460" rx="22" fill="url(#grid)"/>
  <rect x="34" y="34" width="1132" height="392" rx="12" fill="#111621" stroke="#2a3445"/>

  <text x="66" y="76" class="label">LIVE PUBLIC SIGNAL / GITHUB REST API</text>
  <circle cx="1129" cy="69" r="6" fill="#6fffd2" filter="url(#glow)"/>
  <text x="1068" y="73" class="date">ONLINE</text>

  <text x="64" y="145" fill="#f0f4fa" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">TAYLOR YATES</text>
  <text x="66" y="179" class="label">Spaceback / New York, NY</text>

  <g transform="translate(66 222)">
    <rect width="180" height="115" rx="8" fill="#080a10" stroke="#2a3445"/>
    <rect x="198" width="180" height="115" rx="8" fill="#080a10" stroke="#2a3445"/>
    <rect x="396" width="180" height="115" rx="8" fill="#080a10" stroke="#2a3445"/>
    <text x="18" y="30" class="label">PUBLIC REPOS</text>
    <text x="216" y="30" class="label">FOLLOWERS</text>
    <text x="414" y="30" class="label">EVENT SAMPLE</text>
    <text x="18" y="79" class="value">29</text>
    <text x="216" y="79" class="value">28</text>
    <text x="414" y="79" class="value">20</text>
    <path d="M18 96h144M216 96h144M414 96h144" stroke="#6fffd2" stroke-width="3"/>
  </g>

  <path d="M672 204v151" stroke="#2a3445"/>
  <text x="710" y="212" class="label">RECENT PUBLIC ROUTES</text>
  <circle cx="721" cy="235" r="5" fill="#6fffd2"/>
        <text x="738" y="240" class="route">dotfiles</text>
        <text x="1107" y="240" text-anchor="end" class="date">JUL 22, 2026</text><circle cx="721" cy="285" r="5" fill="#6fffd2"/>
        <text x="738" y="290" class="route">isabella</text>
        <text x="1107" y="290" text-anchor="end" class="date">FEB 13, 2026</text><circle cx="721" cy="335" r="5" fill="#6fffd2"/>
        <text x="738" y="340" class="route">yabai-wiki-fork</text>
        <text x="1107" y="340" text-anchor="end" class="date">OCT 09, 2023</text>

  <rect x="66" y="377" width="1068" height="24" rx="4" fill="#080a10" stroke="#2a3445"/>
  <circle cx="83" cy="389" r="4" fill="#ff647c"/>
  <text x="96" y="393" class="date">SELF-HOSTED SVG · UPDATES ONLY WHEN PUBLIC DATA CHANGES · NO VISITOR TRACKING</text>
</svg>
